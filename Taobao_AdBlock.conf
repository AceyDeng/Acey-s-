[rewrite]
# 淘宝/天猫官方广告接口直接返回空白（核心）
^https?://api\.m\.taobao\.com/h5/mtop\.taobao\.ad\. - reject-200
^https?://api\.m\.tmall\.com/h5/mtop\.tmall\.ad\. - reject-200
^https?://adash\.m\.taobao\.com/ - reject-200
^https?://adashbc\.ut\.taobao\.com/ - reject-200
^https?://f\.report\.m\.taobao\.com/ - reject-200
^https?://wmapi\.taobao\.com/ - reject-200
^https?://re\.taobao\.com/ - reject-200
^https?://show\.re\.taobao\.com/ - reject-200
^https?://s\.click\.taobao\.com/ - reject-200
^https?://temai\.taobao\.com/.*ad - reject-200
^https?://feed\.taobao\.com/.*ad - reject-200
^https?://feed\.tmall\.com/.*ad - reject-200

# 第三方广告（淘宝常用）
^https?://([^/]+\.)?doubleclick\.net/ reject-200
^https?://([^/]+\.)?googleadservices\.com/ reject-200
^https?://([^/]+\.)?googlesyndication\.com/ reject-200
^https?://([^/]+\.)?admob\.com/ reject-200
^https?://([^/]+\.)?tencent\.com/ad/ reject-200

# Header 增强（防止反屏蔽）
^https?://api\.m\.taobao\.com/ url header-replace User-Agent Mozilla/5.0 (iPhone; CPU iPhone OS 17_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Mobile/15E148
^https?://adash\.m\.taobao\.com/ url header-add X-Ad-Block true

[mitm]
hostname = api.m.taobao.com, api.m.tmall.com, adash.m.taobao.com, adashbc.ut.taobao.com, f.report.m.taobao.com, wmapi.taobao.com, re.taobao.com, show.re.taobao.com, s.click.taobao.com, temai.taobao.com, feed.taobao.com, feed.tmall.com, *.doubleclick.net, *.googleadservices.com, *.googlesyndication.com, *.admob.com, *.tencent.com
