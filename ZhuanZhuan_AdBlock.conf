[rewrite]
# 转转官方广告接口直接返回空白（核心）
^https?://ads\.zhuan\.zhuan\.com/ reject-200
^https?://api\.zhuan\.zhuan\.com/ad/ reject-200
^https?://ad\.zhuan\.zhuan\.com/ reject-200
^https?://track\.zhuan\.zhuan\.com/ reject-200
^https?://analytics\.zhuan\.zhuan\.com/ reject-200
^https?://api\.zhuan\.zhuan\.com/v1/ad/ reject-200
^https?://api\.zhuan\.zhuan\.com/v2/ad/ reject-200
^https?://api\.zhuan\.zhuan\.com/advert/ reject-200
^https?://api\.zhuan\.zhuan\.com/banner/ reject-200
^https?://api\.zhuan\.zhuan\.com/recommend/ad/ reject-200
^https?://api\.zhuan\.zhuan\.com/feed/ad/ reject-200

# 第三方广告（转转常用）
^https?://([^/]+\.)?doubleclick\.net/ reject-200
^https?://([^/]+\.)?googleadservices\.com/ reject-200
^https?://([^/]+\.)?googlesyndication\.com/ reject-200
^https?://([^/]+\.)?admob\.com/ reject-200
^https?://([^/]+\.)?baidu\.com/ad/ reject-200
^https?://([^/]+\.)?tencent\.com/ad/ reject-200

# Header 增强（防止检测）
^https?://api\.zhuan\.zhuan\.com/ url header-replace User-Agent Mozilla/5.0 (iPhone; CPU iPhone OS 17_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Mobile/15E148
^https?://ads?\.zhuan\.zhuan\.com/ url header-add X-Ad-Block true

[mitm]
hostname = *.zhuan.zhuan.com, *.zhuan.com, ads.zhuan.zhuan.com, ad.zhuan.zhuan.com, track.zhuan.zhuan.com, analytics.zhuan.zhuan.com, api.zhuan.zhuan.com, *.doubleclick.net, *.googleadservices.com, *.googlesyndication.com, *.admob.com, *.baidu.com, *.tencent.com
