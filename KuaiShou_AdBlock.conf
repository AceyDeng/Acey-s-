[rewrite]
# 快手/快手极速版官方广告接口直接返回空白（核心）
^https?://api\.kuaishou\.com/rest/.*ad - reject-200
^https?://ads\.kuaishou\.com/ - reject-200
^https?://ad\.gifshow\.com/ - reject-200
^https?://api\.gifshow\.com/.*ad - reject-200
^https?://neptune\.kuaishou\.com/.*ad - reject-200
^https?://atlas\.kuaishou\.com/ - reject-200
^https?://feed\.kuaishou\.com/.*ad - reject-200
^https?://live\.kuaishou\.com/.*ad - reject-200
^https?://open\.kuaishou\.com/.*ad - reject-200

# 第三方广告（快手常用）
^https?://([^/]+\.)?doubleclick\.net/ reject-200
^https?://([^/]+\.)?googleadservices\.com/ reject-200
^https?://([^/]+\.)?googlesyndication\.com/ reject-200
^https?://([^/]+\.)?admob\.com/ reject-200
^https?://([^/]+\.)?tencent\.com/ad/ reject-200
^https?://([^/]+\.)?baidu\.com/ad/ reject-200

# Header 增强（防止反屏蔽）
^https?://api\.kuaishou\.com/ url header-replace User-Agent Mozilla/5.0 (iPhone; CPU iPhone OS 17_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Mobile/15E148
^https?://ads?\.kuaishou\.com/ url header-add X-Ad-Block true

[mitm]
hostname = api.kuaishou.com, ads.kuaishou.com, ad.gifshow.com, api.gifshow.com, neptune.kuaishou.com, atlas.kuaishou.com, feed.kuaishou.com, live.kuaishou.com, open.kuaishou.com, *.doubleclick.net, *.googleadservices.com, *.googlesyndication.com, *.admob.com, *.tencent.com, *.baidu.com
