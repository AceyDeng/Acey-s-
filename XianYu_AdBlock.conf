[rewrite]
# 闲鱼官方广告接口直接返回空白（核心）
^https?://ad\.xianyu\.com/ reject-200
^https?://api\.m\.xianyu\.com/ad/ reject-200
^https?://ads\.m\.taobao\.com/ reject-200
^https?://api\.m\.taobao\.com/h5/mtop\.taobao\.xianyu\.advert/ reject-200
^https?://api\.m\.taobao\.com/h5/mtop\.taobao\.ad\.xianyu/ reject-200
^https?://api\.m\.taobao\.com/h5/mtop\.taobao\.xianyu\.feed/ reject-200
^https?://api\.m\.taobao\.com/h5/mtop\.taobao\.xianyu\.search/ reject-200
^https?://api\.m\.taobao\.com/h5/mtop\.taobao\.xianyu\.detail/ reject-200
^https?://api\.m\.xianyu\.com/h5/mtop\.taobao\.xianyu\.ad/ reject-200

# 第三方广告（闲鱼常用）
^https?://([^/]+\.)?doubleclick\.net/ reject-200
^https?://([^/]+\.)?googleadservices\.com/ reject-200
^https?://([^/]+\.)?googlesyndication\.com/ reject-200
^https?://([^/]+\.)?admob\.com/ reject-200
^https?://([^/]+\.)?tencent\.com/ad/ reject-200

# Header 增强（防止反屏蔽）
^https?://api\.m\.taobao\.com/ url header-replace User-Agent Mozilla/5.0 (iPhone; CPU iPhone OS 17_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Mobile/15E148
^https?://ad\.xianyu\.com/ url header-add X-Ad-Block true
^https?://ads?\.m\.taobao\.com/ url header-add X-Ad-Block true

[mitm]
hostname = *.xianyu.com, api.m.xianyu.com, ad.xianyu.com, ads.m.taobao.com, api.m.taobao.com, *.doubleclick.net, *.googleadservices.com, *.googlesyndication.com, *.admob.com, *.tencent.com
