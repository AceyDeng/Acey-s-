[rewrite]
# Dreame（石头扫地机器人）去广告规则 - 来自 kelee.one 原插件改
^https?://api\.dreame\.com/v1/ads/ reject-200
^https?://ads\.dreame\.com/ reject-200
^https?://track\.dreame\.com/ reject-200
^https?://analytics\.dreame\.com/ reject-200
^https?://api\.dreame\.com/v1/push/notification/ads reject-200
^https?://api\.dreame\.com/v1/banner/ads reject-200

# 常见第三方广告（原插件也包含）
^https?://([^/]+\.)?doubleclick\.net/ reject-200
^https?://([^/]+\.)?googleadservices\.com/ reject-200
^https?://([^/]+\.)?googlesyndication\.com/ reject-200
^https?://([^/]+\.)?admob\.com/ reject-200
^https?://([^/]+\.)?facebook\.com/tr/ reject-200

# Header Rewrite 部分转成圈X能识别的 header 重写（可选增强效果）
^https?://api\.dreame\.com/ url header-replace User-Agent Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1
^https?://ads\.dreame\.com/ url header-replace Referer https://app.dreame.com
^https?://track\.dreame\.com/ url header-del X-Requested-With
^https?://api\.dreame\.com/v1/ads/ url header-add X-Ad-Block true


