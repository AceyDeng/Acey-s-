[rewrite]
# B站官方广告接口直接返回空白
^https?://app\.bilibili\.com/.*ad reject-200
^https?://api\.bilibili\.com/.*ad reject-200
^https?://ads\.bilibili\.com/ reject-200
^https?://s\.bilibili\.tv/.*ad reject-200
^https?://bangumi\.bilibili\.com/.*ad reject-200
^https?://i\.bilibili\.com/.*ad reject-200
^https?://member\.bilibili\.com/.*ad reject-200
^https?://www\.bilibili\.com/.*ad reject-200

# 第三方广告
^https?://([^/]+\.)?doubleclick\.net/ reject-200
^https?://([^/]+\.)?googleadservices\.com/ reject-200
^https?://([^/]+\.)?tencent\.com/ad/ reject-200

# Header 增强
^https?://api\.bilibili\.com/ url header-replace User-Agent Mozilla/5.0 (iPhone; CPU iPhone OS 17_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Mobile/15E148
^https?://ads\.bilibili\.com/ url header-add X-Ad-Block true

[mitm]
hostname = app.bilibili.com, api.bilibili.com, ads.bilibili.com, s.bilibili.tv, bangumi.bilibili.com, i.bilibili.com, member.bilibili.com, www.bilibili.com, *.doubleclick.net, *.googleadservices.com, *.tencent.com
