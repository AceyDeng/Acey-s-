
[rewrite]
# 拼多多官方广告接口直接返回空白
^https?://api\.pinduoduo\.com/v1/ads/ reject-200
^https?://ads\.pinduoduo\.com/ reject-200
^https?://track\.pinduoduo\.com/ reject-200
^https?://analytics\.pinduoduo\.com/ reject-200
^https?://api\.pinduoduo\.com/v1/push/notification/ads reject-200
^https?://api\.pinduoduo\.com/v1/banner/ads reject-200
^https?://api\.pinduoduo\.com/v1/recommend/ads reject-200
^https?://api\.pinduoduo\.com/v1/search/ads reject-200
^https?://api\.pinduoduo\.com/v1/product/detail/ads reject-200

# 第三方广告（拼多多常用）
^https?://([^/]+\.)?doubleclick\.net/ reject-200
^https?://([^/]+\.)?googleadservices\.com/ reject-200
^https?://([^/]+\.)?googlesyndication\.com/ reject-200
^https?://([^/]+\.)?admob\.com/ reject-200
^https?://([^/]+\.)?facebook\.com/tr/ reject-200
^https?://([^/]+\.)?baidu\.com/ad/ reject-200
^https?://([^/]+\.)?tencent\.com/ad/ reject-200
^https?://([^/]+\.)?sogou\.com/ad/ reject-200

# Header 重写（原 Loon Header Rewrite 完整搬迁）
^https?://api\.pinduoduo\.com/ url header-replace User-Agent Mozilla/5.0 (iPhone; CPU iPhone OS 17_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Mobile/15E148
^https?://ads\.pinduoduo\.com/ url header-replace Referer https://mobile.yangkeduo.com
^https?://track\.pinduoduo\.com/ url header-del X-Requested-With
^https?://analytics\.pinduoduo\.com/ url header-del Accept-Language
^https?://api\.pinduoduo\.com/v1/ads/ url header-add X-Ad-Block true
^https?://api\.pinduoduo\.com/v1/recommend/ads url header-add X-No-Ads 1

[mitm]
# 必须加这一段！不然重写完全不生效
hostname = api.pinduoduo.com, ads.pinduoduo.com, track.pinduoduo.com, analytics.pinduoduo.com, mobile.yangkeduo.com, *.doubleclick.net, *.googleadservices.com, *.googlesyndication.com, *.admob.com, *.facebook.com, *.baidu.com, *.tencent.com, *.sogou.com