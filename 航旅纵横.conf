[rewrite]
# Umetrip 官方广告接口直接返回空白
^https?://api\.umetrip\.com/v1/ads/ reject-200
^https?://ads\.umetrip\.com/ reject-200
^https?://track\.umetrip\.com/ reject-200
^https?://analytics\.umetrip\.com/ reject-200
^https?://api\.umetrip\.com/v1/recommend/ads reject-200
^https?://api\.umetrip\.com/v1/banner/ads reject-200
^https?://api\.umetrip\.com/v1/search/ads reject-200

# 第三方广告
^https?://([^/]+\.)?doubleclick\.net/ reject-200
^https?://([^/]+\.)?googleadservices\.com/ reject-200
^https?://([^/]+\.)?tencent\.com/ad/ reject-200

# Header 增强
^https?://api\.umetrip\.com/ url header-replace User-Agent Mozilla/5.0 (iPhone; CPU iPhone OS 17_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Mobile/15E148
^https?://ads\.umetrip\.com/ url header-add X-Ad-Block true

[mitm]
hostname = api.umetrip.com, ads.umetrip.com, track.umetrip.com, analytics.umetrip.com, *.doubleclick.net, *.googleadservices.com, *.tencent.com
