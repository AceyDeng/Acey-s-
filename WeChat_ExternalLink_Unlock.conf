[rewrite]
# 微信外部链接直接解锁（2025 年最新版，持续维护）
# 淘宝/天猫/京东/拼多多
^https?://(a|m)\.taobao\.com/i/ redirect-302 https://$1.taobao.com/i/
^https?://(a|m)\.tmall\.com/i/ redirect-302 https://$1.tmall.com/i/
^https?://(item|detail)\.jd\.com/ redirect-302 https://$1.jd.com/
^https?://(item\.m|item)\.jd\.com/ redirect-302 https://item.jd.com/
^https?://(mobile\.yangkeduo|pinduoduo)\.com/(goods|goods2|item)\.html redirect-302 https://mobile.yangkeduo.com/$2.html

# 抖音/抖音极速版
^https?://(v|aweme)\.douyin\.com/ redirect-302 https://$1.douyin.com/
^https?://(iesdouyin|douyin)\.com/ redirect-302 https://www.douyin.com/

# 小红书
^https?://(x\.red|xhslink)\.com/ redirect-302 https://www.xiaohongshu.com/

# 微博
^https?://(weibb|weibo)\.com/ redirect-302 https://weibo.com/

# 快手
^https?://(k\.ks|gifshow)\.com/ redirect-302 https://www.kuaishou.com/

# B 站
^https?://(b23\.tv|bilibili\.com)/ redirect-302 https://www.bilibili.com/

# 通用跳转兜底（防止漏掉新链接）
^https?://weixin\.110\.com/s/.* redirect-302 $0
^https?://weixin\.qq\.com/s/.* redirect-302 $0

# Header 伪装（防止微信检测）
^https?://weixin.*\.qq\.com/ url header-replace User-Agent Mozilla/5.0 (iPhone; CPU iPhone OS 17_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Mobile/15E148 Safari/604.1

[mitm]
hostname = weixin110.com, weixin.qq.com, long.weixin.qq.com, short.weixin.qq.com, *.taobao.com, *.tmall.com, *.jd.com, *.yangkeduo.com, *.douyin.com, *.xhslink.com, *.xiaohongshu.com, *.weibo.com, *.kuaishou.com, *.bilibili.com, *.b23.tv
