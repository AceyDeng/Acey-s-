[rewrite]
# 京东官方广告接口直接返回空白（核心）
^https?://api\.m\.jd\.com/.*ad - reject-200
^https?://ad\.m\.jd\.com/ - reject-200
^https?://beta\.api\.m\.jd\.com/.*ad - reject-200
^https?://ad\-api\.jd\.com/ - reject-200
^https?://adreport\.jd\.com/ - reject-200
^https?://wq\.jd\.com/.*ad - reject-200
^https?://feed\.m\.jd\.com/.*ad - reject-200
^https?://search\.m\.jd\.com/.*ad - reject-200
^https?://item\.m\.jd\.com/.*ad - reject-200
^https?://live\.jd\.com/.*ad - reject-200

# 第三方广告（京东常用）
^https?://([^/]+\.)?doubleclick\.net/ reject-200
^https?://([^/]+\.)?googleadservices\.com/ reject-200
^https?://([^/]+\.)?googlesyndication\.com/ reject-200
^https?://([^/]+\.)?admob\.com/ reject-200
^https?://([^/]+\.)?tencent\.com/ad/ reject-200
^https?://([^/]+\.)?baidu\.com/ad/ reject-200

# Header 增强（防止反屏蔽）
^https?://api\.m\.jd\.com/ url header-replace User-Agent Mozilla/5.0 (iPhone; CPU iPhone OS 17_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Mobile/15E148
^https?://ad?\.m\.jd\.com/ url header-add X-Ad-Block true

[mitm]
hostname = api.m.jd.com, ad.m.jd.com, beta.api.m.jd.com, ad-api.jd.com, adreport.jd.com, wq.jd.com, feed.m.jd.com, search.m.jd.com, item.m.jd.com, live.jd.com, *.doubleclick.net, *.googleadservices.com, *.googlesyndication.com, *.admob.com, *.tencent.com, *.baidu.com
