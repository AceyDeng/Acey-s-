[rewrite]
# 高德地图官方广告接口直接返回空白
^https?://wprdsearch\.amap\.com/.*ad reject-200
^https?://restapi\.amap\.com/v3/.*ad reject-200
^https?://ads\.amap\.com/ reject-200
^https?://api\.amap\.com/.*ad reject-200
^https?://ws\.amap\.com/.*ad reject-200
^https?://webapp\.amap\.com/.*ad reject-200
^https?://lbsnav\.amap\.com/.*ad reject-200

# 第三方广告
^https?://([^/]+\.)?doubleclick\.net/ reject-200
^https?://([^/]+\.)?baidu\.com/ad/ reject-200
^https?://([^/]+\.)?tencent\.com/ad/ reject-200

# Header 增强
^https?://api\.amap\.com/ url header-replace User-Agent Mozilla/5.0 (iPhone; CPU iPhone OS 17_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Mobile/15E148
^https?://ads\.amap\.com/ url header-add X-Ad-Block true

[mitm]
hostname = wprdsearch.amap.com, restapi.amap.com, ads.amap.com, api.amap.com, ws.amap.com, webapp.amap.com, lbsnav.amap.com, *.doubleclick.net, *.baidu.com, *.tencent.com
